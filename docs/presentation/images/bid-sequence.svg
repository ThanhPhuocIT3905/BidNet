<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1280" height="900" fill="#f8fafc"/>
  <text x="640" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f172a">Luồng đặt giá — POST /api/products/{id}/bids</text>
  <text x="640" y="62" text-anchor="middle" font-size="13.5" fill="#475569">Services/BidService.cs → PlaceAsync (dòng 15–73) • điểm ghi bid DUY NHẤT của hệ thống</text>

  <!-- lifelines -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="40" y="85" width="150" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="115" y="112" fill="#1e3a8a">Client</text>
    <rect x="250" y="85" width="170" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="335" y="105" fill="#14532d">ProductController</text>
    <text x="335" y="122" font-size="11" font-weight="normal" fill="#166534">[Authorize] + rate "bid"</text>
    <rect x="480" y="85" width="160" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="560" y="112" fill="#7c2d12">BidService</text>
    <rect x="700" y="85" width="160" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="780" y="105" fill="#713f12">CurrentUser</text>
    <text x="780" y="122" font-size="11" font-weight="normal" fill="#854d0e">RequireActiveAsync</text>
    <rect x="920" y="85" width="150" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="995" y="112" fill="#0c4a6e">SQL Server</text>
    <rect x="1120" y="85" width="140" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1190" y="105" fill="#4c1d95">AuctionHub</text>
    <text x="1190" y="122" font-size="11" font-weight="normal" fill="#5b21b6">nhóm auction:{id}</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="115" y1="129" x2="115" y2="855"/>
    <line x1="335" y1="129" x2="335" y2="855"/>
    <line x1="560" y1="129" x2="560" y2="855"/>
    <line x1="780" y1="129" x2="780" y2="855"/>
    <line x1="995" y1="129" x2="995" y2="855"/>
    <line x1="1190" y1="129" x2="1190" y2="855"/>
  </g>

  <!-- messages -->
  <line x1="115" y1="165" x2="335" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="130" y="158" font-size="13" fill="#0f172a">1. { amount } + Authorization: Bearer JWT</text>

  <line x1="335" y1="205" x2="560" y2="205" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="350" y="198" font-size="13" fill="#0f172a">2. PlaceAsync(id, amount)</text>

  <line x1="560" y1="245" x2="780" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="575" y="238" font-size="13" fill="#0f172a">3. Lấy user từ claim Id</text>
  <line x1="780" y1="275" x2="995" y2="275" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="795" y="268" font-size="13" fill="#0f172a">4. Đọc DB: user tồn tại + IsActive?</text>
  <text x="795" y="295" font-size="12" fill="#dc2626">↳ Khóa/chưa login → 403/401 NGAY (kể cả JWT còn hạn)</text>

  <line x1="560" y1="330" x2="995" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="575" y="323" font-size="13" fill="#0f172a">5. Tải Product (kèm RowVersion hiện tại)</text>

  <!-- checks box -->
  <rect x="440" y="350" width="500" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="455" y="374" font-size="13.5" font-weight="bold" fill="#7c2d12">6. Kiểm tra nghiệp vụ (giờ server DateTime.UtcNow):</text>
  <g font-size="12.5" fill="#9a3412">
    <text x="455" y="396">• Người bán tự đặt → 403 seller_cannot_bid (BR-07)</text>
    <text x="455" y="416">• Status ≠ Active hoặc ngoài [StartTime, EndTime) → 409 auction_not_active</text>
    <text x="455" y="436">• Amount không nguyên dương VND → 400 invalid_bid</text>
    <text x="455" y="456">• Bid đầu ≥ StartingPrice; bid sau ≥ CurrentPrice + 1.000, nếu không → 400 bid_too_low</text>
  </g>

  <line x1="560" y1="505" x2="995" y2="505" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="575" y="498" font-size="13" font-weight="bold" fill="#0f172a">7. MỘT SaveChanges: INSERT Bid + UPDATE CurrentPrice</text>
  <text x="575" y="527" font-size="12.5" fill="#b91c1c">UPDATE ... WHERE Id=@id AND RowVersion=@old ← chìa khóa chống đua giá</text>

  <!-- success branch -->
  <rect x="880" y="550" width="230" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="995" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Thành công (1 row affected)</text>
  <text x="995" y="592" text-anchor="middle" font-size="12" fill="#166534">RowVersion tự tăng</text>

  <line x1="995" y1="625" x2="560" y2="625" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="620" y="618" font-size="13" fill="#14532d">8a. Commit OK</text>

  <line x1="560" y1="665" x2="1190" y2="665" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arr)"/>
  <text x="620" y="658" font-size="13" fill="#4c1d95">9. CHỈ SAU commit: SendAsync("BidAccepted", {productId, currentPrice, bidTime})</text>
  <text x="620" y="687" font-size="12" fill="#64748b">Lỗi gửi SignalR chỉ log warning — bid đã lưu vẫn trả 201 (không tạo bid trùng)</text>

  <line x1="560" y1="720" x2="115" y2="720" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="200" y="713" font-size="13" font-weight="bold" fill="#14532d">10a. 201 Created + BidResponseDto</text>

  <!-- conflict branch -->
  <rect x="880" y="745" width="380" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1070" y="768" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">8b. DbUpdateConcurrencyException (0 row)</text>
  <text x="1070" y="788" text-anchor="middle" font-size="12" fill="#991b1b">Request khác đã ghi trước → RowVersion không khớp</text>
  <text x="1070" y="805" text-anchor="middle" font-size="12" fill="#991b1b">KHÔNG ghi đè — giao dịch rollback toàn bộ</text>

  <line x1="880" y1="835" x2="115" y2="835" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="200" y="828" font-size="13" font-weight="bold" fill="#7f1d1d">409 bid_conflict — "Giá đã thay đổi, hãy tải lại và đặt giá mới"</text>

  <text x="640" y="882" text-anchor="middle" font-size="12.5" fill="#64748b">BR-11: Bid + CurrentPrice atomic trong 1 transaction • BR-12: optimistic concurrency bằng rowversion • Không phát realtime trước khi lưu</text>
</svg>
