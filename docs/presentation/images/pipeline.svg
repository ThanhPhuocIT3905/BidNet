<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1240" height="640" fill="#f8fafc"/>
  <text x="620" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f172a">HTTP Pipeline &amp; Xử lý lỗi thống nhất</text>
  <text x="620" y="62" text-anchor="middle" font-size="13.5" fill="#475569">Program.cs dòng 184–225 • Middleware/ExceptionHandlingMiddleware.cs • Middleware/RequestLoggingMiddleware.cs</text>

  <!-- pipeline chain -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="40" y="100" width="120" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="100" y="126" font-weight="bold" fill="#7f1d1d">Exception</text>
    <text x="100" y="144" fill="#991b1b">Handling</text>
    <text x="100" y="160" font-size="10.5" fill="#991b1b">try/catch toàn cục</text>

    <rect x="185" y="100" width="120" height="66" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="245" y="126" font-weight="bold" fill="#7c2d12">Request</text>
    <text x="245" y="144" fill="#9a3412">Logging</text>
    <text x="245" y="160" font-size="10.5" fill="#9a3412">method, ms, TraceId</text>

    <rect x="330" y="100" width="120" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="390" y="126" font-weight="bold" fill="#713f12">StatusCode</text>
    <text x="390" y="144" fill="#854d0e">Pages</text>
    <text x="390" y="160" font-size="10.5" fill="#854d0e">JSON 401/403/404/429</text>

    <rect x="475" y="100" width="110" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="530" y="126" font-weight="bold" fill="#334155">HTTPS</text>
    <text x="530" y="144" fill="#475569">Redirection</text>

    <rect x="610" y="100" width="100" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="660" y="133" font-weight="bold" fill="#334155">Routing</text>

    <rect x="735" y="100" width="100" height="66" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="785" y="126" font-weight="bold" fill="#0c4a6e">CORS</text>
    <text x="785" y="144" font-size="10.5" fill="#075985">FrontendOnly</text>
    <text x="785" y="160" font-size="10.5" fill="#075985">:3000 duy nhất</text>

    <rect x="860" y="100" width="115" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="917" y="126" font-weight="bold" fill="#14532d">Authentication</text>
    <text x="917" y="144" font-size="10.5" fill="#166534">đọc JWT trước</text>

    <rect x="1000" y="100" width="100" height="66" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="1050" y="126" font-weight="bold" fill="#831843">RateLimiter</text>
    <text x="1050" y="144" font-size="10.5" fill="#9d174d">biết user nào</text>
    <text x="1050" y="160" font-size="10.5" fill="#9d174d">đang gọi</text>

    <rect x="1125" y="100" width="100" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1175" y="126" font-weight="bold" fill="#4c1d95">Authorization</text>
    <text x="1175" y="144" font-size="10.5" fill="#5b21b6">[Authorize]</text>
    <text x="1175" y="160" font-size="10.5" fill="#5b21b6">Roles=Admin</text>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="160" y1="133" x2="185" y2="133" marker-end="url(#arr)"/>
    <line x1="305" y1="133" x2="330" y2="133" marker-end="url(#arr)"/>
    <line x1="450" y1="133" x2="475" y2="133" marker-end="url(#arr)"/>
    <line x1="585" y1="133" x2="610" y2="133" marker-end="url(#arr)"/>
    <line x1="710" y1="133" x2="735" y2="133" marker-end="url(#arr)"/>
    <line x1="835" y1="133" x2="860" y2="133" marker-end="url(#arr)"/>
    <line x1="975" y1="133" x2="1000" y2="133" marker-end="url(#arr)"/>
    <line x1="1100" y1="133" x2="1125" y2="133" marker-end="url(#arr)"/>
  </g>
  <text x="620" y="200" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b91c1c">Thứ tự quan trọng: Authentication PHẢI trước RateLimiter để policy "bid" đếm theo username (30 lần/phút), không chỉ theo IP</text>

  <!-- error mapping -->
  <rect x="60" y="230" width="560" height="290" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="340" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">ExceptionHandlingMiddleware — mọi lỗi về 1 mối</text>
  <g font-size="13" fill="#0f172a">
    <text x="84" y="290">ApiException (lỗi nghiệp vụ có chủ đích) → đúng StatusCode của nó</text>
    <text x="84" y="314">ArgumentException / InvalidOperationException → 400</text>
    <text x="84" y="338">KeyNotFoundException → 404 • UnauthorizedAccessException → 401</text>
    <text x="84" y="362">Lỗi khác → 500, message chung chung, KHÔNG lộ stack trace</text>
    <text x="84" y="386">≥500: LogError • &lt;500: LogWarning (kèm TraceId, Method, Path)</text>
    <text x="84" y="410">Client ngắt kết nối (OperationCanceledException) → bỏ qua</text>
  </g>
  <rect x="84" y="428" width="512" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="96" y="450" font-size="12.5" font-family="Consolas, monospace" fill="#334155">{ "statusCode": 409, "message": "Giá đã thay đổi...",</text>
  <text x="96" y="470" font-size="12.5" font-family="Consolas, monospace" fill="#334155">  "detail": null, "traceId": "0HN...", "timestamp": "..." }</text>
  <text x="96" y="492" font-size="11.5" fill="#64748b">detail chỉ hiện ở Development • traceId để đối chiếu log server</text>

  <!-- rate limit + logging -->
  <rect x="650" y="230" width="530" height="140" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="915" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#831843">Rate Limiting (Program.cs dòng 140–155)</text>
  <g font-size="13" fill="#9d174d">
    <text x="674" y="290">• Policy "auth": 10 request/phút theo IP → chống dò mật khẩu</text>
    <text x="674" y="314">• Policy "bid": 30 request/phút theo username → chống spam đặt giá</text>
    <text x="674" y="338">• Hết quota → 429 NGAY, QueueLimit = 0 (không xếp hàng dồn request)</text>
    <text x="674" y="360" font-size="12" fill="#64748b">FixedWindowLimiter — cửa sổ cố định 1 phút</text>
  </g>

  <rect x="650" y="390" width="530" height="130" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="915" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">Serilog + RequestLogging</text>
  <g font-size="13" fill="#9a3412">
    <text x="674" y="448">• Ghi Console + File Logs/log-.txt cuộn theo ngày</text>
    <text x="674" y="472">• Mỗi request 1 dòng: method, path, status, số ms, user, TraceId</text>
    <text x="674" y="496">• Không log mật khẩu/token/connection string</text>
  </g>

  <rect x="60" y="545" width="1120" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="620" y="572" text-anchor="middle" font-size="13.5" fill="#713f12">Demo trước lớp: gọi GET /api/Errors/server → xem JSON 500 + traceId, rồi mở Logs/log-*.txt tìm đúng traceId đó.</text>
  <text x="620" y="596" text-anchor="middle" font-size="13.5" fill="#713f12">ErrorsController là endpoint DEMO có chủ đích để chứng minh middleware hoạt động (bad-request / not-found / unauthorized / server).</text>
</svg>
