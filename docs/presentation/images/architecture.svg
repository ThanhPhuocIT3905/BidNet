<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1240" height="860" fill="#f8fafc"/>
  <text x="620" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Kiến trúc tổng thể BidNet (ASP.NET Core 10 Web API)</text>

  <!-- Client -->
  <rect x="420" y="65" width="400" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">Client (Frontend :3000 / Swagger UI)</text>
  <text x="620" y="118" text-anchor="middle" font-size="13" fill="#1e40af">REST JSON + JWT (header) • WebSocket SignalR (access_token query)</text>

  <!-- arrows client -> server -->
  <line x1="540" y1="135" x2="540" y2="185" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="528" y="165" text-anchor="end" font-size="13" fill="#2563eb">HTTPS REST</text>
  <line x1="700" y1="135" x2="700" y2="185" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="712" y="165" font-size="13" fill="#2563eb">/hubs/auction</text>

  <!-- Server big box -->
  <rect x="60" y="190" width="1120" height="520" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="80" y="220" font-size="18" font-weight="bold" fill="#0f172a">Server BidNet — Program.cs (khởi động, DI, pipeline)</text>

  <!-- Middleware -->
  <rect x="90" y="240" width="1060" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Middleware pipeline (thứ tự bắt buộc)</text>
  <text x="620" y="288" text-anchor="middle" font-size="13.5" fill="#78350f">ExceptionHandling → RequestLogging → StatusCodePages → HTTPS → Routing → CORS → Authentication (JWT) → RateLimiter → Authorization</text>

  <!-- Controllers -->
  <rect x="90" y="325" width="640" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Controllers/ — nhận request, trả HTTP status (mỏng)</text>
  <text x="410" y="374" text-anchor="middle" font-size="13" fill="#166534">AuthController • ProductController • ProductImagesController</text>
  <text x="410" y="396" text-anchor="middle" font-size="13" fill="#166534">UserController • AdminController • ErrorsController (demo lỗi)</text>

  <!-- Hub -->
  <rect x="760" y="325" width="390" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="955" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">Hubs/AuctionHub.cs (SignalR)</text>
  <text x="955" y="374" text-anchor="middle" font-size="13" fill="#5b21b6">[Authorize] • JoinProduct / LeaveProduct</text>
  <text x="955" y="396" text-anchor="middle" font-size="13" fill="#5b21b6">Nhóm "auction:{id}" • BidAccepted / AuctionClosed</text>

  <!-- Services -->
  <rect x="90" y="440" width="640" height="110" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="410" y="465" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">Services/ — toàn bộ nghiệp vụ (BR-01…BR-17)</text>
  <text x="410" y="489" text-anchor="middle" font-size="13" fill="#9a3412">AuthService (PBKDF2 + JWT) • ProductService • BidService (đặt giá)</text>
  <text x="410" y="510" text-anchor="middle" font-size="13" fill="#9a3412">ProductImageService (Cloudinary) • UserService • CurrentUser</text>
  <text x="410" y="531" text-anchor="middle" font-size="13" fill="#9a3412">ApiException • PageArgs • Mappers</text>

  <!-- Worker -->
  <rect x="760" y="440" width="390" height="110" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="955" y="465" text-anchor="middle" font-size="15" font-weight="bold" fill="#831843">AuctionClosingService (BackgroundService)</text>
  <text x="955" y="489" text-anchor="middle" font-size="13" fill="#9d174d">Quét mỗi 5 giây • lô tối đa 50 phiên</text>
  <text x="955" y="510" text-anchor="middle" font-size="13" fill="#9d174d">Scheduled → Active → Completed</text>
  <text x="955" y="531" text-anchor="middle" font-size="13" fill="#9d174d">Chọn người thắng • phát AuctionClosed</text>

  <!-- Repos + DbContext -->
  <rect x="90" y="575" width="1060" height="64" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="620" y="600" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">Repositories/ (Auth, User, Bid) + Data/AppDbContext (EF Core 10)</text>
  <text x="620" y="623" text-anchor="middle" font-size="13" fill="#075985">DbSet: Users, Products, Bids, ProductImages • Unique index • Index (Status, StartTime, EndTime) • RowVersion • Migrations</text>

  <!-- arrows inside -->
  <line x1="410" y1="415" x2="410" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="550" x2="410" y2="575" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="955" y1="550" x2="955" y2="575" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <!-- bid service -> hub -->
  <path d="M 730 480 L 760 480" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <path d="M 955 415 L 955 440" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1000" y="432" font-size="11.5" fill="#7c3aed">IHubContext (sau commit)</text>

  <!-- DB -->
  <rect x="240" y="750" width="330" height="72" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="405" y="780" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">SQL Server — BidNetDb</text>
  <text x="405" y="803" text-anchor="middle" font-size="13" fill="#334155">Nguồn sự thật cuối cùng • rowversion chống đua giá</text>
  <line x1="405" y1="639" x2="405" y2="750" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="415" y="700" font-size="13" fill="#475569">EF Core / SQL (migration)</text>

  <!-- Cloudinary -->
  <rect x="700" y="750" width="330" height="72" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="865" y="780" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Cloudinary (CDN ảnh)</text>
  <text x="865" y="803" text-anchor="middle" font-size="13" fill="#334155">Lưu file ảnh • DB chỉ chứa metadata + URL</text>
  <line x1="865" y1="639" x2="865" y2="750" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="875" y="700" font-size="13" fill="#475569">Upload / Destroy (HTTPS)</text>

  <text x="620" y="848" text-anchor="middle" font-size="12.5" fill="#64748b">Luồng: Client → Middleware → Controller → Service → DbContext → SQL Server; SignalR &amp; Worker đọc/ghi cùng DB, chỉ phát sự kiện SAU khi lưu thành công</text>
</svg>
